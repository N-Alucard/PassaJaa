<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassaJá - Exames & Bolsas de Estudo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Ícones do Lucide
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} class={`inline-block ${className}`} style={{ width: size, height: size }}></i>;
        };

        const INSTITUTIONS = [
            { id: 'all', name: 'Todas as Instituições' },
            { id: 'UEM', name: 'Univ. Eduardo Mondlane (UEM)' },
            { id: 'UP', name: 'Univ. Pedagógica (UP)' },
            { id: 'UniZambeze', name: 'Univ. Zambeze (UniZambeze)' },
            { id: 'UniLúrio', name: 'Univ. Lúrio (UniLúrio)' },
            { id: 'ACIPOL', name: 'ACIPOL' },
            { id: 'AM', name: 'Academia Militar' }
        ];

        const SUBJECTS = ['Todas as Disciplinas', 'Matemática', 'Português', 'Biologia', 'Física', 'Química', 'História', 'Geografia'];

        const INITIAL_EXAMS = [
            { id: 'exam-1', title: 'Exame de Admissão de Matemática I', institution: 'UEM', subject: 'Matemática', year: 2024, type: 'Exame', fileSize: '2.4 MB', downloads: 1420 },
            { id: 'exam-2', title: 'Exame de Admissão de Português', institution: 'UP', subject: 'Português', year: 2024, type: 'Exame', fileSize: '1.8 MB', downloads: 2150 },
            { id: 'exam-3', title: 'Edital Geral de Exames de Admissão 2025/2026', institution: 'UEM', subject: 'Português', year: 2025, type: 'Edital', fileSize: '3.1 MB', downloads: 4890 },
            { id: 'exam-4', title: 'Exame de Biologia Geral', institution: 'UniLúrio', subject: 'Biologia', year: 2023, type: 'Exame', fileSize: '2.9 MB', downloads: 980 }
        ];

        const SCHOLARSHIPS = [
            { id: 'sch-1', title: 'Bolsa de Estudo de Mérito IBE', provider: 'Gov. Moçambique', destination: 'Moçambique', level: 'Licenciatura', status: 'Inscrições Abertas' },
            { id: 'sch-2', title: 'Bolsas de Licenciatura e Mestrado', provider: 'Fundação BCI / Camões', destination: 'Portugal', level: 'Licenciatura / Mestrado', status: 'Brevemente' }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('exams');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedInst, setSelectedInst] = useState('all');
            const [selectedSubject, setSelectedSubject] = useState('Todas as Disciplinas');

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab]);

            const filteredExams = useMemo(() => {
                return INITIAL_EXAMS.filter(e => {
                    const matchSearch = e.title.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchInst = selectedInst === 'all' || e.institution === selectedInst;
                    const matchSubject = selectedSubject === 'Todas as Disciplinas' || e.subject === selectedSubject;
                    return matchSearch && matchInst && matchSubject;
                });
            }, [searchTerm, selectedInst, selectedSubject]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header */}
                    <header className="bg-white border-b sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">PJ</div>
                                <span className="text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                                    PassaJá
                                </span>
                            </div>
                            <nav className="flex space-x-2">
                                <button 
                                    onClick={() => setActiveTab('exams')}
                                    className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'exams' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    Exames & Materiais
                                </button>
                                <button 
                                    onClick={() => setActiveTab('scholarships')}
                                    className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'scholarships' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                                >
                                    Bolsas de Estudo
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Banner Hero */}
                    <section className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white py-12 px-4">
                        <div className="max-w-4xl mx-auto text-center space-y-4">
                            <h1 className="text-3xl md:text-5xl font-bold">O Teu Portal de Preparação Académica em Moçambique</h1>
                            <p className="text-blue-100 text-lg">Encontre exames de admissão, editais, guias de correção e bolsas de estudo num só lugar.</p>
                        </div>
                    </section>

                    {/* Conteúdo Principal */}
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
                        {activeTab === 'exams' && (
                            <div className="space-y-6">
                                {/* Barra de Filtros */}
                                <div className="bg-white p-4 rounded-xl shadow-sm border flex flex-col md:flex-row gap-4">
                                    <input 
                                        type="text" 
                                        placeholder="Pesquisar por título ou disciplina..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="flex-grow px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                    <select 
                                        value={selectedInst} 
                                        onChange={(e) => setSelectedInst(e.target.value)}
                                        className="px-4 py-2 border rounded-lg bg-white"
                                    >
                                        {INSTITUTIONS.map(inst => (
                                            <option key={inst.id} value={inst.id}>{inst.name}</option>
                                        ))}
                                    </select>
                                    <select 
                                        value={selectedSubject} 
                                        onChange={(e) => setSelectedSubject(e.target.value)}
                                        className="px-4 py-2 border rounded-lg bg-white"
                                    >
                                        {SUBJECTS.map(subj => (
                                            <option key={subj} value={subj}>{subj}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* Lista de Exames */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredExams.map(exam => (
                                        <div key={exam.id} className="bg-white border rounded-xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                            <div>
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded">
                                                        {exam.institution}
                                                    </span>
                                                    <span className="text-xs text-slate-500 font-medium">{exam.year}</span>
                                                </div>
                                                <h3 className="font-bold text-slate-800 text-lg mb-2">{exam.title}</h3>
                                                <p className="text-sm text-slate-600 mb-4">Disciplina: {exam.subject}</p>
                                            </div>
                                            <div className="pt-4 border-t flex items-center justify-between text-sm text-slate-500">
                                                <span>{exam.fileSize} • {exam.downloads} downloads</span>
                                                <button 
                                                    onClick={() => alert(`Download simulado do exame: ${exam.title}`)}
                                                    className="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-1.5 rounded-lg transition text-xs"
                                                >
                                                    Baixar PDF
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'scholarships' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-800">Oportunidades de Bolsas de Estudo</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {SCHOLARSHIPS.map(sch => (
                                        <div key={sch.id} className="bg-white border rounded-xl p-6 shadow-sm flex flex-col justify-between">
                                            <div>
                                                <span className="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded mb-3 inline-block">
                                                    {sch.status}
                                                </span>
                                                <h3 className="font-bold text-xl text-slate-800 mb-2">{sch.title}</h3>
                                                <p className="text-sm text-slate-600 mb-1"><strong>Entidade:</strong> {sch.provider}</p>
                                                <p className="text-sm text-slate-600 mb-1"><strong>Destino:</strong> {sch.destination}</p>
                                                <p className="text-sm text-slate-600"><strong>Nível:</strong> {sch.level}</p>
                                            </div>
                                            <button 
                                                onClick={() => alert(`Ver mais detalhes sobre: ${sch.title}`)}
                                                className="mt-6 w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg transition text-sm"
                                            >
                                                Ver Requisitos & Candidatura
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-auto">
                        <div className="max-w-7xl mx-auto px-4 text-center text-sm">
                            <p>&copy; 2026 PassaJá. Todos os direitos reservados.</p>
                            <p className="mt-1 text-slate-500">Preparação Académica e Bolsas de Estudo em Moçambique.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
